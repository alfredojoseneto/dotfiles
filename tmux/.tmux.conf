# ============================================================================
# ~/.tmux.conf — macOS Tahoe edition (adapted from a Debian/Linux config)
# ============================================================================

# -------------------- GENERAL CONFIGURATION ----------------------------------

# remove escape time delay (important for vim/nvim responsiveness)
set -s escape-time 0

# colors: 256 + truecolor (needs tmux >= 3.2)
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Undercurl support (needs tmux >= 3.0)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# increase scrollback buffer to 10000
set -g history-limit 10000

# -------------------- RELOAD CONFIGURATION -----------------------------------
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"

# -------------------- DISPLAY CONFIGURATION ----------------------------------
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename off  # keep window names fixed (do not follow the running program)
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

# -------------------- NAVIGATION ---------------------------------------------
# Set new panes/windows to open in current directory
bind c new-window -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"      # horizontal split (stacked panes)
bind v split-window -h -c "#{pane_current_path}"      # vertical split (side by side panes)

# resize panes evenly: "PREFIX e v" (even-vertical) / "PREFIX e h" (even-horizontal)
bind e switch-client -T multiKeyBindings
bind -T multiKeyBindings v select-layout even-vertical
bind -T multiKeyBindings h select-layout even-horizontal

# pane navigation (vim-style)
bind h select-pane -L     # move left
bind j select-pane -D     # move down
bind k select-pane -U     # move up
bind l select-pane -R     # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# -------------------- COPY and PASTE (macOS native clipboard) ----------------
# Enable vi-copy-mode
setw -g mode-keys vi

# turn this on if you want to use touchpad/mouse to scroll and select panes
setw -g mouse on

# macOS ships with pbcopy/pbpaste natively — no xclip or extra install needed
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# -------------------- SYNCHRONIZE PANES --------------------------------------
bind a setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,#[bg=red]#[fg=yellow] ON ,#[bg=cyan]#[fg=black]OFF}"

# ----------------------------- LIST OF PLUGINS --------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Dracula Theme configuration (owns the status bar and pane border styling)
set -g @plugin 'dracula/tmux'

# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage,
# network, network-bandwidth, network-ping, attached-clients, network-vpn, weather,
# time, spotify-tui, kubernetes-context, synchronize-panes
# set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-plugins "time"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session   # accepts: session, smiley, window, or any character
set -g @dracula-refresh-rate 5

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run -b '~/.tmux/plugins/tpm/tpm'
